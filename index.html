<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Party - Juego de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rolling {
            animation: roll 0.5s ease-in-out;
        }
        .die {
            transition: all 0.3s ease;
        }
        .die:hover {
            transform: scale(1.05);
        }
        .die.locked {
            box-shadow: 0 0 0 3px #3b82f6;
        }
        .score-cell {
            transition: background-color 0.2s ease;
        }
        .score-cell:hover:not(.used) {
            background-color: #dbeafe;
            cursor: pointer;
        }
        .score-cell.used {
            background-color: #f3f4f6;
            color: #6b7280;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-400 via-pink-500 to-red-500 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-5xl font-bold text-white mb-2">🎲 Dice Party 🎲</h1>
            <p class="text-white text-lg">¡Estilo Plato App!</p>
        </div>

        <!-- Main Game Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Left Panel - Dice & Controls -->
            <div class="lg:col-span-2">
                <!-- Game Info -->
                <div class="bg-white rounded-lg shadow-2xl p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <p class="text-gray-600">Turno</p>
                            <p class="text-3xl font-bold text-purple-600" id="currentTurn">1</p>
                        </div>
                        <div>
                            <p class="text-gray-600">Tiradas restantes</p>
                            <p class="text-3xl font-bold text-pink-600" id="rollsLeft">3</p>
                        </div>
                        <div>
                            <p class="text-gray-600">Puntuación Total</p>
                            <p class="text-3xl font-bold text-red-600" id="totalScore">0</p>
                        </div>
                    </div>
                </div>

                <!-- Dice Container -->
                <div class="bg-white rounded-lg shadow-2xl p-8 mb-6">
                    <div class="flex justify-center items-center gap-4 flex-wrap" id="diceContainer">
                        <!-- Dice will be generated here -->
                    </div>
                    <p class="text-center text-gray-500 mt-4 text-sm">Haz click en un dado para bloquearlo</p>
                </div>

                <!-- Control Buttons -->
                <div class="bg-white rounded-lg shadow-2xl p-6">
                    <div class="flex gap-4 justify-center">
                        <button id="rollBtn" class="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-8 py-3 rounded-lg font-bold text-lg hover:from-purple-600 hover:to-pink-600 transform hover:scale-105 transition-all shadow-lg">
                            🎲 Tirar Dados
                        </button>
                        <button id="newGameBtn" class="bg-gray-600 text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-gray-700 transform hover:scale-105 transition-all shadow-lg">
                            🔄 Nuevo Juego
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Score Table -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-2xl p-6">
                    <h2 class="text-2xl font-bold text-center mb-4 text-purple-600">Puntuación</h2>

                    <!-- Upper Section -->
                    <div class="mb-4">
                        <h3 class="font-bold text-gray-700 mb-2 pb-2 border-b-2 border-purple-300">Sección Superior</h3>
                        <div id="upperSection" class="space-y-1">
                            <!-- Upper section rows will be generated here -->
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-300 flex justify-between text-sm font-semibold">
                            <span>Subtotal:</span>
                            <span id="upperSubtotal">0</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Bonus (63+):</span>
                            <span id="bonusScore" class="text-green-600">0</span>
                        </div>
                        <div class="flex justify-between font-bold text-purple-600 pt-2 border-t border-gray-300">
                            <span>Total Superior:</span>
                            <span id="upperTotal">0</span>
                        </div>
                    </div>

                    <!-- Lower Section -->
                    <div>
                        <h3 class="font-bold text-gray-700 mb-2 pb-2 border-b-2 border-pink-300">Sección Inferior</h3>
                        <div id="lowerSection" class="space-y-1">
                            <!-- Lower section rows will be generated here -->
                        </div>
                        <div class="flex justify-between font-bold text-pink-600 pt-2 border-t border-gray-300 mt-2">
                            <span>Total Inferior:</span>
                            <span id="lowerTotal">0</span>
                        </div>
                    </div>

                    <!-- Grand Total -->
                    <div class="mt-4 pt-4 border-t-4 border-purple-500">
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold">TOTAL FINAL:</span>
                            <span class="text-3xl font-bold text-red-600" id="grandTotal">0</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Game State
        const gameState = {
            dice: [1, 1, 1, 1, 1],
            locked: [false, false, false, false, false],
            rollsLeft: 3,
            currentTurn: 1,
            scores: {
                ones: null, twos: null, threes: null, fours: null, fives: null, sixes: null,
                threeOfKind: null, fourOfKind: null, fullHouse: null,
                smallStraight: null, largeStraight: null, yahtzee: null, chance: null
            }
        };

        // Score Categories Configuration
        const categories = {
            upper: [
                { id: 'ones', name: 'Unos (1s)', value: 1 },
                { id: 'twos', name: 'Doses (2s)', value: 2 },
                { id: 'threes', name: 'Treses (3s)', value: 3 },
                { id: 'fours', name: 'Cuatros (4s)', value: 4 },
                { id: 'fives', name: 'Cincos (5s)', value: 5 },
                { id: 'sixes', name: 'Seises (6s)', value: 6 }
            ],
            lower: [
                { id: 'threeOfKind', name: 'Trío (3 iguales)', points: 'Suma' },
                { id: 'fourOfKind', name: 'Poker (4 iguales)', points: 'Suma' },
                { id: 'fullHouse', name: 'Full House', points: '25' },
                { id: 'smallStraight', name: 'Escalera Menor', points: '30' },
                { id: 'largeStraight', name: 'Escalera Mayor', points: '40' },
                { id: 'yahtzee', name: 'Yahtzee (5 iguales)', points: '50' },
                { id: 'chance', name: 'Suerte', points: 'Suma' }
            ]
        };

        // Initialize Game
        function initGame() {
            createDice();
            createScoreTable();
            updateDisplay();
            document.getElementById('rollBtn').addEventListener('click', rollDice);
            document.getElementById('newGameBtn').addEventListener('click', newGame);
        }

        // Create Dice Elements
        function createDice() {
            const container = document.getElementById('diceContainer');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const die = document.createElement('div');
                die.className = 'die bg-white border-4 border-gray-300 rounded-xl w-20 h-20 flex items-center justify-center text-4xl cursor-pointer select-none';
                die.id = `die${i}`;
                die.textContent = '⚀';
                die.addEventListener('click', () => toggleLock(i));
                container.appendChild(die);
            }
        }

        // Create Score Table
        function createScoreTable() {
            // Upper Section
            const upperSection = document.getElementById('upperSection');
            categories.upper.forEach(cat => {
                const row = createScoreRow(cat.id, cat.name, '0');
                upperSection.appendChild(row);
            });

            // Lower Section
            const lowerSection = document.getElementById('lowerSection');
            categories.lower.forEach(cat => {
                const row = createScoreRow(cat.id, cat.name, cat.points);
                lowerSection.appendChild(row);
            });
        }

        // Create Score Row
        function createScoreRow(id, name, defaultPoints) {
            const row = document.createElement('div');
            row.className = 'score-cell flex justify-between items-center p-2 rounded hover:bg-blue-50';
            row.id = `row-${id}`;
            row.innerHTML = `
                <span class="text-sm">${name}</span>
                <span class="font-bold text-blue-600" id="score-${id}">-</span>
            `;
            row.addEventListener('click', () => selectScore(id));
            return row;
        }

        // Toggle Lock on Dice
        function toggleLock(index) {
            if (gameState.rollsLeft < 3) {
                gameState.locked[index] = !gameState.locked[index];
                updateDiceDisplay();
            }
        }

        // Roll Dice
        function rollDice() {
            if (gameState.rollsLeft === 0) return;

            // Animate and roll unlocked dice
            for (let i = 0; i < 5; i++) {
                if (!gameState.locked[i]) {
                    const die = document.getElementById(`die${i}`);
                    die.classList.add('rolling');
                    setTimeout(() => die.classList.remove('rolling'), 500);
                    gameState.dice[i] = Math.floor(Math.random() * 6) + 1;
                }
            }

            gameState.rollsLeft--;
            updateDisplay();
            updatePossibleScores();
        }

        // Update Dice Display
        function updateDiceDisplay() {
            const diceSymbols = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

            for (let i = 0; i < 5; i++) {
                const die = document.getElementById(`die${i}`);
                die.textContent = diceSymbols[gameState.dice[i] - 1];

                if (gameState.locked[i]) {
                    die.classList.add('locked');
                    die.classList.remove('border-gray-300');
                    die.classList.add('border-blue-500');
                } else {
                    die.classList.remove('locked');
                    die.classList.remove('border-blue-500');
                    die.classList.add('border-gray-300');
                }
            }
        }

        // Update Display
        function updateDisplay() {
            document.getElementById('currentTurn').textContent = gameState.currentTurn;
            document.getElementById('rollsLeft').textContent = gameState.rollsLeft;
            updateDiceDisplay();
            updateTotalScores();
        }

        // Calculate Possible Scores
        function updatePossibleScores() {
            const dice = gameState.dice;

            // Count occurrences
            const counts = {};
            dice.forEach(d => counts[d] = (counts[d] || 0) + 1);

            // Update each category
            categories.upper.forEach(cat => {
                if (gameState.scores[cat.id] === null) {
                    const score = (counts[cat.value] || 0) * cat.value;
                    document.getElementById(`score-${cat.id}`).textContent = score;
                }
            });

            // Lower section
            if (gameState.scores.threeOfKind === null) {
                const score = hasNOfKind(3) ? sumDice() : 0;
                document.getElementById('score-threeOfKind').textContent = score;
            }

            if (gameState.scores.fourOfKind === null) {
                const score = hasNOfKind(4) ? sumDice() : 0;
                document.getElementById('score-fourOfKind').textContent = score;
            }

            if (gameState.scores.fullHouse === null) {
                const score = isFullHouse() ? 25 : 0;
                document.getElementById('score-fullHouse').textContent = score;
            }

            if (gameState.scores.smallStraight === null) {
                const score = isSmallStraight() ? 30 : 0;
                document.getElementById('score-smallStraight').textContent = score;
            }

            if (gameState.scores.largeStraight === null) {
                const score = isLargeStraight() ? 40 : 0;
                document.getElementById('score-largeStraight').textContent = score;
            }

            if (gameState.scores.yahtzee === null) {
                const score = hasNOfKind(5) ? 50 : 0;
                document.getElementById('score-yahtzee').textContent = score;
            }

            if (gameState.scores.chance === null) {
                document.getElementById('score-chance').textContent = sumDice();
            }
        }

        // Scoring Functions
        function sumDice() {
            return gameState.dice.reduce((a, b) => a + b, 0);
        }

        function hasNOfKind(n) {
            const counts = {};
            gameState.dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
            return Object.values(counts).some(count => count >= n);
        }

        function isFullHouse() {
            const counts = {};
            gameState.dice.forEach(d => counts[d] = (counts[d] || 0) + 1);
            const values = Object.values(counts).sort();
            return values.length === 2 && values[0] === 2 && values[1] === 3;
        }

        function isSmallStraight() {
            const unique = [...new Set(gameState.dice)].sort();
            const straights = [[1,2,3,4], [2,3,4,5], [3,4,5,6]];
            return straights.some(straight =>
                straight.every(num => unique.includes(num))
            );
        }

        function isLargeStraight() {
            const sorted = [...gameState.dice].sort().join('');
            return sorted === '12345' || sorted === '23456';
        }

        // Select Score
        function selectScore(category) {
            if (gameState.scores[category] !== null) return;
            if (gameState.rollsLeft === 3) return;

            const scoreElement = document.getElementById(`score-${category}`);
            const score = parseInt(scoreElement.textContent) || 0;

            gameState.scores[category] = score;
            scoreElement.textContent = score;

            const row = document.getElementById(`row-${category}`);
            row.classList.add('used');
            row.style.cursor = 'default';

            nextTurn();
        }

        // Next Turn
        function nextTurn() {
            gameState.currentTurn++;
            gameState.rollsLeft = 3;
            gameState.locked = [false, false, false, false, false];
            gameState.dice = [1, 1, 1, 1, 1];

            if (gameState.currentTurn > 13) {
                endGame();
                return;
            }

            updateDisplay();
            clearPossibleScores();
        }

        // Clear Possible Scores
        function clearPossibleScores() {
            Object.keys(gameState.scores).forEach(key => {
                if (gameState.scores[key] === null) {
                    document.getElementById(`score-${key}`).textContent = '-';
                }
            });
        }

        // Update Total Scores
        function updateTotalScores() {
            // Upper section
            let upperSum = 0;
            categories.upper.forEach(cat => {
                if (gameState.scores[cat.id] !== null) {
                    upperSum += gameState.scores[cat.id];
                }
            });
            document.getElementById('upperSubtotal').textContent = upperSum;

            // Bonus
            const bonus = upperSum >= 63 ? 35 : 0;
            document.getElementById('bonusScore').textContent = bonus;

            const upperTotal = upperSum + bonus;
            document.getElementById('upperTotal').textContent = upperTotal;

            // Lower section
            let lowerSum = 0;
            categories.lower.forEach(cat => {
                if (gameState.scores[cat.id] !== null) {
                    lowerSum += gameState.scores[cat.id];
                }
            });
            document.getElementById('lowerTotal').textContent = lowerSum;

            // Grand total
            const grandTotal = upperTotal + lowerSum;
            document.getElementById('grandTotal').textContent = grandTotal;
            document.getElementById('totalScore').textContent = grandTotal;
        }

        // End Game
        function endGame() {
            const finalScore = document.getElementById('grandTotal').textContent;
            setTimeout(() => {
                alert(`🎉 ¡Juego Terminado! 🎉\n\nTu puntuación final: ${finalScore} puntos`);
            }, 500);
        }

        // New Game
        function newGame() {
            if (confirm('¿Estás seguro de que quieres empezar un nuevo juego?')) {
                gameState.dice = [1, 1, 1, 1, 1];
                gameState.locked = [false, false, false, false, false];
                gameState.rollsLeft = 3;
                gameState.currentTurn = 1;
                gameState.scores = {
                    ones: null, twos: null, threes: null, fours: null, fives: null, sixes: null,
                    threeOfKind: null, fourOfKind: null, fullHouse: null,
                    smallStraight: null, largeStraight: null, yahtzee: null, chance: null
                };

                // Reset UI
                Object.keys(gameState.scores).forEach(key => {
                    const row = document.getElementById(`row-${key}`);
                    row.classList.remove('used');
                    row.style.cursor = 'pointer';
                    document.getElementById(`score-${key}`).textContent = '-';
                });

                updateDisplay();
            }
        }

        // Start the game when page loads
        initGame();
    </script>
</body>
</html>
