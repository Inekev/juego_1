<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Party - Juego de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Setup Screen -->
    <div id="setupScreen" class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="max-w-2xl w-full">
            <div class="text-center mb-12 fade-in">
                <h1 class="text-6xl font-bold gradient-text mb-3">Dice Party</h1>
                <p class="text-gray-600 text-lg">Juego de dados multijugador</p>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-8 fade-in border border-gray-100">
                <h2 class="text-2xl font-semibold text-gray-900 mb-8">Configuración del juego</h2>

                <!-- Number of Players -->
                <div class="mb-8">
                    <label class="block text-sm font-medium text-gray-700 mb-4">Número de jugadores</label>
                    <div class="flex gap-3 justify-center">
                        <button onclick="selectPlayerCount(1)" class="player-select-btn w-14 h-14 rounded-xl font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-all transform hover:scale-105 border-2 border-transparent">1</button>
                        <button onclick="selectPlayerCount(2)" class="player-select-btn w-14 h-14 rounded-xl font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-all transform hover:scale-105 border-2 border-transparent">2</button>
                        <button onclick="selectPlayerCount(3)" class="player-select-btn w-14 h-14 rounded-xl font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-all transform hover:scale-105 border-2 border-transparent">3</button>
                        <button onclick="selectPlayerCount(4)" class="player-select-btn w-14 h-14 rounded-xl font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-all transform hover:scale-105 border-2 border-transparent">4</button>
                        <button onclick="selectPlayerCount(5)" class="player-select-btn w-14 h-14 rounded-xl font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-all transform hover:scale-105 border-2 border-transparent">5</button>
                    </div>
                </div>

                <!-- Player Names -->
                <div id="playerNamesContainer" class="mb-8 hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-4">Nombres de jugadores</label>
                    <div id="playerNameInputs" class="space-y-3">
                        <!-- Player name inputs will be generated here -->
                    </div>
                </div>

                <!-- Start Game Button -->
                <div class="text-center">
                    <button id="startGameBtn" onclick="startGame()" class="hidden bg-gray-900 text-white px-8 py-3 rounded-xl font-semibold hover:bg-gray-800 transform hover:scale-105 transition-all shadow-lg">
                        Comenzar juego
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden min-h-screen py-8 px-4">
        <div class="max-w-7xl mx-auto">

            <!-- Header -->
            <div class="mb-8 text-center">
                <h1 class="text-3xl font-bold gradient-text mb-2">Dice Party</h1>
                <p class="text-gray-600 text-sm">Ronda <span id="currentRound">1</span> de 13</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

                <!-- Left Sidebar - Players List -->
                <div class="lg:col-span-3">
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 sticky top-6">
                        <h2 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wide">Jugadores</h2>
                        <div id="playersList" class="space-y-3">
                            <!-- Players will be generated here -->
                        </div>
                    </div>
                </div>

                <!-- Center - Game Area -->
                <div class="lg:col-span-6">

                    <!-- Current Player Info -->
                    <div class="bg-white rounded-xl shadow-sm p-6 mb-6 border border-gray-100">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <p class="text-sm text-gray-500 mb-1">Turno actual</p>
                                <h2 class="text-2xl font-bold text-gray-900" id="currentPlayerName">Jugador 1</h2>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-500 mb-1">Puntos</p>
                                <p class="text-2xl font-bold text-blue-600" id="currentScore">0</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-sm">
                            <div class="flex items-center gap-2">
                                <span class="text-gray-500">Tiradas:</span>
                                <span class="font-semibold text-gray-900" id="rollsLeft">3</span>
                            </div>
                        </div>
                    </div>

                    <!-- Dice Container -->
                    <div class="bg-white rounded-xl shadow-sm p-8 mb-6 border border-gray-100">
                        <div class="flex justify-center items-center gap-4 flex-wrap mb-4" id="diceContainer">
                            <!-- Dice will be generated here -->
                        </div>
                        <p class="text-center text-gray-400 text-xs">Click en un dado para bloquearlo</p>
                    </div>

                    <!-- Control Buttons -->
                    <div class="flex gap-3 justify-center flex-wrap">
                        <button id="rollBtn" onclick="rollDice()" class="bg-gray-900 text-white px-6 py-3 rounded-xl font-semibold hover:bg-gray-800 transition-all shadow-sm">
                            🎲 Tirar dados
                        </button>
                        <button onclick="showScoreboard()" class="bg-white text-gray-700 px-6 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all shadow-sm border border-gray-200">
                            📊 Ver tabla
                        </button>
                        <button onclick="backToSetup()" class="bg-white text-gray-700 px-6 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all shadow-sm border border-gray-200">
                            ← Menú
                        </button>
                    </div>
                </div>

                <!-- Right Sidebar - Score Table -->
                <div class="lg:col-span-3">
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 sticky top-6">
                        <h2 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wide">Categorías</h2>

                        <!-- Upper Section -->
                        <div class="mb-4">
                            <h3 class="text-xs font-medium text-gray-500 mb-2 uppercase tracking-wide">Superior</h3>
                            <div id="upperSection" class="space-y-1">
                                <!-- Upper section rows will be generated here -->
                            </div>
                            <div class="mt-3 pt-3 border-t border-gray-200 space-y-1 text-xs">
                                <div class="flex justify-between text-gray-600">
                                    <span>Subtotal</span>
                                    <span id="upperSubtotal" class="font-semibold">0</span>
                                </div>
                                <div class="flex justify-between text-gray-600">
                                    <span>Bonus (63+)</span>
                                    <span id="bonusScore" class="font-semibold text-green-600">0</span>
                                </div>
                                <div class="flex justify-between font-semibold text-gray-900">
                                    <span>Total</span>
                                    <span id="upperTotal">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Lower Section -->
                        <div>
                            <h3 class="text-xs font-medium text-gray-500 mb-2 uppercase tracking-wide">Inferior</h3>
                            <div id="lowerSection" class="space-y-1">
                                <!-- Lower section rows will be generated here -->
                            </div>
                            <div class="mt-3 pt-3 border-t border-gray-200 text-xs">
                                <div class="flex justify-between font-semibold text-gray-900">
                                    <span>Total</span>
                                    <span id="lowerTotal">0</span>
                                </div>
                            </div>
                        </div>

                        <!-- Grand Total -->
                        <div class="mt-4 pt-4 border-t-2 border-gray-900">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-gray-900 uppercase tracking-wide text-sm">Total</span>
                                <span class="text-2xl font-bold text-gray-900" id="grandTotal">0</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div id="scoreboardModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-6xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Tabla de puntuaciones</h2>
                <button onclick="hideScoreboard()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold w-8 h-8 flex items-center justify-center">&times;</button>
            </div>
            <div id="scoreboardContent" class="overflow-x-auto">
                <!-- Scoreboard will be generated here -->
            </div>
            <div class="text-center mt-6">
                <button onclick="hideScoreboard()" class="bg-gray-900 text-white px-6 py-3 rounded-xl font-semibold hover:bg-gray-800">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
